#:schema node_modules/wrangler/config-schema.json
name = "webclipboard"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Custom domain (uncomment after the zone webclipboard.online is active on Cloudflare).
# routes = [
#   { pattern = "webclipboard.online", custom_domain = true },
#   { pattern = "www.webclipboard.online", custom_domain = true },
# ]

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Only these paths invoke the Worker (and count toward the 100k/day free request quota).
# Everything else (every language page, CSS, JS, sitemap...) is served as free static assets.
run_worker_first = ["/api/*", "/c/*"]

[[d1_databases]]
binding = "DB"
database_name = "webclipboard"
# Replace with the id printed by: npx wrangler d1 create webclipboard
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Workers Rate Limiting (per client IP). namespace_id is any number unique within your account.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "7001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "7002"
simple = { limit = 30, period = 60 }

[triggers]
crons = ["17 * * * *"]

[observability]
enabled = true
head_sampling_rate = 0.1
